<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>World Map</title>
<style>
:root{--bg:#f4f6f8;--card:#ffffff;--text:#1c2430;--muted:#5d6b7a;--land:#b9c7d6;--hover:#2f6fed;--border:#ffffff;--tip:#1c2430;--tiptext:#ffffff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1520;--card:#171f2d;--text:#e8edf3;--muted:#92a0b1;--land:#34445a;--hover:#5b9bff;--border:#171f2d;--tip:#e8edf3;--tiptext:#0f1520;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1520;--card:#171f2d;--text:#e8edf3;--muted:#92a0b1;--land:#34445a;--hover:#5b9bff;--border:#171f2d;--tip:#e8edf3;--tiptext:#0f1520;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px}
h1{font-size:1.5rem;margin:0 0 4px}
p.sub{margin:0 0 16px;color:var(--muted)}
.card{background:var(--card);border-radius:14px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
#map{width:100%;height:60vh;min-height:280px;position:relative}
#map svg{width:100%;height:100%;display:block}
#map path{stroke:var(--border);stroke-width:.5}
.jvm-tooltip{position:absolute;display:none;pointer-events:none;background:var(--tip);color:var(--tiptext);padding:4px 8px;border-radius:6px;font-size:14px;white-space:nowrap;z-index:10}
.jvm-tooltip.active{display:block}
#readout{margin-top:10px;text-align:center;font-size:1.1rem;min-height:1.5em;color:var(--muted)}
#readout b{color:var(--text)}
</style>
</head>
<body>
<main>
  <h1>World Map</h1>
  <p class="sub">Hover over a country to see its name.</p>
  <div class="card">
    <div id="map"></div>
    <div id="readout">Hover over a country</div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/js/jsvectormap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/maps/world.js"></script>
<script>
(function(){
  var readout=document.getElementById('readout');
  try{
    var map=new jsVectorMap({
      selector:'#map',
      map:'world',
      zoomButtons:false,
      zoomOnScroll:false,
      regionStyle:{
        initial:{fill:getComputedStyle(document.documentElement).getPropertyValue('--land').trim()||'#b9c7d6'},
        hover:{fill:getComputedStyle(document.documentElement).getPropertyValue('--hover').trim()||'#2f6fed'}
      },
      onRegionTooltipShow:function(event,tooltip,code){
        var name='';
        try{name=map.mapData.paths[code].name}catch(e){}
        if(!name){try{name=tooltip.text()}catch(e){}}
        if(name){readout.innerHTML='<b>'+name+'</b>'}
      },
      onRegionOut:function(){readout.textContent='Hover over a country'}
    });
  }catch(e){
    readout.textContent='The map could not load.';
  }
})();
</script>
</body>
</html>
